<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#130c19"><meta name="description" content="Eleven months, a million ways to say I love you.">
<title>For Trin ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--light:#fff5f7;--muted:#e5c6d3;--pink:#ffc6d9}*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#130c19;color:var(--light)}
body{font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #ffe1ec;outline-offset:4px}
#app{position:relative;isolation:isolate;width:100%;height:100%;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 50% 44%,#3b1930 0%,#20101f 41%,#120c18 78%)}
#app:before{content:"";position:absolute;inset:-30%;z-index:-1;background:radial-gradient(circle at 24% 52%,#fc8bba18,transparent 31%),radial-gradient(circle at 77% 23%,#ab81de1a,transparent 27%);animation:breath 14s ease-in-out infinite alternate}
@keyframes breath{to{transform:translate(5%,-3%) scale(1.1)}}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.grain{position:absolute;inset:0;opacity:.11;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.2' filter='url(%23n)'/%3E%3C/svg%3E")}
header{position:absolute;z-index:5;top:0;left:0;right:0;padding:clamp(20px,3.5vw,42px);display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.brand{font:italic 24px "Playfair Display",Georgia,serif;color:#ffe0e9}
.chapter{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#f3c5d5}
.view{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;opacity:0;visibility:hidden;transition:opacity 1.1s ease,visibility 1.1s;pointer-events:none}
.view.active{opacity:1;visibility:visible}
.kicker{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#ffc3d5;font-weight:600}
.hero{font:400 clamp(68px,12vw,155px)/1.13 "Playfair Display",Georgia,serif;letter-spacing:-.075em;margin:15px 0}
.hero em{font-weight:400;color:var(--pink)}
.subtitle{font:italic clamp(17px,2.1vw,25px)/1.55 "Playfair Display",Georgia,serif;color:#efd5de;max-width:510px}
.primary{margin-top:41px;display:inline-flex;align-items:center;justify-content:center;gap:11px;padding:16px 30px;color:#fff3f6;background:#ffd3e31d;border:1px solid #ffe3eb7a;border-radius:80px;font-size:12px;font-weight:700;letter-spacing:.06em;backdrop-filter:blur(15px);transition:transform .25s,background .25s;pointer-events:auto}
.primary:hover{transform:translateY(-3px);background:#ffd3e333}
.caption{position:absolute;z-index:3;bottom:clamp(105px,14vh,160px);left:20px;right:20px;text-align:center;opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 1s;pointer-events:none;color:#ffdfeb;font:italic clamp(16px,2vw,25px) "Playfair Display",serif;text-shadow:0 1px 22px #190916}
.caption.visible{opacity:1;visibility:visible}
.caption small{display:block;margin-top:13px;font:500 10px "DM Sans",sans-serif;letter-spacing:.21em;text-transform:uppercase;color:#ffdfeb}
#final{background:radial-gradient(ellipse at 50% 45%,#66294152,transparent 60%)}
#final .hero{
 font-family:"DM Sans",Arial,sans-serif;font-size:clamp(34px,6.2vw,92px);
 font-weight:800;letter-spacing:-.055em;line-height:1.16;
 max-width:min(1100px,94vw);text-wrap:balance;
 color:#ffe4ed;text-shadow:0 0 35px #f47da459;
}
#final .subtitle{max-width:530px}
#final .message{max-width:430px;margin-top:24px;font-size:clamp(12px,1.3vw,15px);line-height:1.85;color:#e9bfd0}
.beating{font-size:34px;color:#ffbad0;filter:drop-shadow(0 0 19px #f57ba6);animation:beat 2s infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.18)}29%{transform:scale(.98)}43%{transform:scale(1.12)}}
.sparkles{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.spark{position:absolute;left:var(--x);top:var(--y);width:2px;height:2px;border-radius:50%;background:#ffe5ed;opacity:0;animation:twinkle var(--dur) ease-in-out var(--delay) infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.65;transform:scale(1.7)}}
nav{position:absolute;z-index:6;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:23px clamp(20px,3.5vw,42px) max(23px,env(safe-area-inset-bottom));opacity:0;visibility:hidden;transition:opacity .35s}
nav.active{opacity:1;visibility:visible}
.nav-btn{border:1px solid #ffe2ec42;color:#fbe6ee;background:#1a101b80;border-radius:30px;padding:11px 17px;font-size:12px;font-weight:600;backdrop-filter:blur(12px);min-width:87px}
.nav-btn:hover{background:#ffd4e321}
.nav-btn:disabled{opacity:.24;cursor:default}
.progress{display:flex;align-items:center;gap:9px}
.dot{width:5px;height:5px;border-radius:50%;background:#ffcfe052;transition:background .3s,transform .3s}
.dot.on{background:#ffe3ed;transform:scale(1.55);box-shadow:0 0 9px #ffb3cd88}
#zoom{position:absolute;z-index:5;top:92px;right:clamp(20px,3.5vw,42px);display:none;gap:8px}
#zoom.active{display:flex}
#zoom button{padding:10px 13px;border-radius:25px;border:1px solid #ffe0e65c;background:#160e18b8;color:#fff5f8;font-size:13px;backdrop-filter:blur(12px)}
#error{position:absolute;z-index:8;bottom:86px;width:100%;padding:0 25px;text-align:center;color:#ffdee8;font-size:12px;display:none}
#prefers{position:absolute;z-index:6;top:90px;left:clamp(20px,3.5vw,42px);border:0;color:#ffe4ee;background:transparent;font-size:11px;opacity:.7;cursor:pointer}
@media(max-width:600px){
 .hero{font-size:clamp(64px,16vw,100px)}
 #intro .hero{margin-bottom:6px}
 #final .hero{font-size:clamp(32px,8.7vw,58px);line-height:1.25;max-width:94vw;letter-spacing:-.045em}
 .chapter{letter-spacing:.10em;font-size:9px}
 .primary{margin-top:28px;min-height:48px;font-size:13px;padding:14px 26px}
 nav{padding:12px 16px max(18px,env(safe-area-inset-bottom))}
 .nav-btn{min-height:44px;min-width:80px;padding:10px 12px}
 .caption{bottom:108px}
 #zoom{top:77px;right:15px}
 #zoom button{min-width:44px;min-height:44px}
 header{padding:18px 16px}
}
@media(max-height:650px){#final .hero{font-size:clamp(29px,7vh,58px)}#final .primary{margin-top:15px}}
@media(prefers-reduced-motion:reduce){.spark,#app:before,.beating{animation:none!important}.view,.caption{transition-duration:.1s!important}}
</style>
</head>
<body>
<main id="app">
<canvas id="canvas" aria-label="Animated words of love morphing into shapes and a cow portrait"></canvas>
<div class="grain"></div><div id="sparkles" class="sparkles" aria-hidden="true"></div>
<header><span class="brand">B ♡ T</span><span id="chapter" class="chapter"></span></header>
<section id="intro" class="view active" aria-label="Welcome">
<div class="kicker">JUST FOR YOU</div>
<h1 class="hero">For <em>Trin.</em></h1>

<button id="start" class="primary">Start <span aria-hidden="true">♡</span></button>
</section>
<div id="trinCaption" class="caption"></div>
<div id="heartCaption" class="caption"></div>
<div id="cowCaption" class="caption"></div>
<section id="final" class="view" aria-label="Anniversary message">
<h2 class="hero">HAPPY 11 MONTHS<br>BEBE I LOVE YOU!!!</h2>
<button id="replay" class="primary">Replay ↻</button>
</section>
<div id="zoom"><button id="zoomout" aria-label="Zoom out">−</button><button id="zoomin" aria-label="Zoom in">＋</button></div>
<div id="error" role="status"></div>
<nav id="nav" aria-label="Scenes"><button id="back" class="nav-btn">← Back</button>
<div id="dots" class="progress" aria-label="Scene progress"></div>
<button id="next" class="nav-btn">Next →</button></nav>
</main>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("canvas"),ctx=canvas.getContext("2d",{alpha:true});
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const languages=[
"I love you","Je t'aime","Te amo","Ti amo","Ich liebe dich",
"Eu te amo","愛してる","사랑해","我爱你","Ik hou van jou",
"Jag älskar dig","Σ' αγαπώ","Aku cinta kamu","Anh yêu em",
"Seni seviyorum","Я тебя люблю","ฉันรักเธอ","Kocham cię",
"Volim te","Mahal kita","Te iubesc","Jeg elsker deg",
"أحبك","Szeretlek","Miluji tě","Nakupenda"
];
const palette=["#ffb7af","#ffaba6","#ff9b9b","#ffb9ba","#ffc3c8","#f59da8","#ffd1cf"];
const timings=[0,5000,5000,5000,0];
let W=innerWidth,H=innerHeight,DPR=1,scene=0,sceneAt=performance.now();
let nodes=[],cowImage=null,cowCanvas=null,cowReady=false,cowZoom=1,nextTimer=null,resizeTimer=null,completed=false;
for(let i=0;i<54;i++){
 const s=document.createElement("i");s.className="spark";
 s.style.setProperty("--x",Math.random()*100+"%");
 s.style.setProperty("--y",Math.random()*100+"%");
 s.style.setProperty("--dur",(3+Math.random()*5)+"s");
 s.style.setProperty("--delay",(-Math.random()*8)+"s");$("sparkles").appendChild(s);
}
for(let i=0;i<4;i++){const dot=document.createElement("i");dot.className="dot";$("dots").appendChild(dot)}
const dots=[...$("dots").children];
const mask=document.createElement("canvas"),m=mask.getContext("2d",{willReadFrequently:true});
function buildMask(kind){
 mask.width=W;mask.height=H;m.clearRect(0,0,W,H);
 m.fillStyle="#fff";m.strokeStyle="#fff";
 if(kind==="trin"){
  let f=Math.min(H*.49,W*.265);
  m.font="900 "+f+"px Arial Black, Arial, sans-serif";
  while(m.measureText("TRIN").width>W*.87&&f>28){f-=3;m.font="900 "+f+"px Arial Black, Arial, sans-serif"}
  m.textAlign="center";m.textBaseline="middle";m.lineWidth=f*.105;m.lineJoin="round";
  m.strokeText("TRIN",W*.5,H*.448);m.fillText("TRIN",W*.5,H*.448);
 }else{
  const scale=Math.min(W*.46,H*.35),cx=W*.5,cy=H*.436;
  m.beginPath();
  for(let t=0;t<=Math.PI*2+.02;t+=.018){
   const xx=(16*Math.sin(t)**3/18)*scale;
   const yy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/18*scale;
   if(t===0)m.moveTo(cx+xx,cy+yy);else m.lineTo(cx+xx,cy+yy);
  }
  m.closePath();m.fill();
 }
 return m.getImageData(0,0,W,H).data;
}
// Find mask runs and lay phrases in rows, measuring their real width.
// Phrases cannot collide or draw indiscriminately on top of each other.
function makeLayout(kind){
 const pixels=buildMask(kind);
 const isFilled=(x,y)=>{
  x=Math.round(x);y=Math.round(y);
  if(x<0||y<0||x>=W||y>=H)return false;
  return pixels[(y*W+x)*4+3]>125;
 };
 const base=kind==="heart"?clamp(W/63,15,25):clamp(W/91,11,19);
 const line=kind==="heart"?base*1.48:base*1.40;
 const placements=[],startY=H*.18,endY=H*.74;
 let globalIndex=0,rowIndex=0;
 for(let y=startY;y<endY;y+=line,rowIndex++){
  const runs=[];let left=-1;
  for(let x=Math.floor(W*.055);x<=Math.ceil(W*.945);x+=3){
   if(isFilled(x,y)){
    if(left<0)left=x;
   }else if(left>=0){if(x-left>base*1.65)runs.push([left,x]);left=-1}
  }
  if(left>=0)runs.push([left,W*.945]);
  for(const [a,b] of runs){
   let cursor=a+2;
   const max=b-2;
   while(cursor+base*1.1<max){
    let selected=null;
    // Rotate language choice across rows; prioritize readable larger type.
    const offset=(globalIndex*7+rowIndex*5)%languages.length;
    for(const sizeScale of [1.12,1,.87,.75,.64]){
     const fontSize=base*sizeScale;
     m.font="700 "+fontSize+"px Arial, sans-serif";
     for(let k=0;k<languages.length;k++){
      const phrase=languages[(offset+k)%languages.length];
      const width=m.measureText(phrase).width;
      const gap=Math.max(4,fontSize*.28);
      if(width+gap>max-cursor)continue;
      const cx=cursor+width/2;
      // Prevent full words being placed outside the letter / heart silhouette.
      let hits=0;
      for(const u of [.06,.26,.5,.74,.94]){
       if(isFilled(cursor+width*u,y))hits++;
       if(isFilled(cursor+width*u,y-fontSize*.52))hits++;
      }
      if(hits<8)continue;
      selected={text:phrase,x:cx,y,font:fontSize,width,color:palette[(globalIndex+rowIndex)%palette.length]};
      break;
     }
     if(selected)break;
    }
    if(selected){placements.push(selected);cursor+=selected.width+Math.max(4,selected.font*.29);globalIndex++}
    else cursor+=Math.max(4,base*.30);
   }
  }
 }
 return placements.sort((a,b)=>a.y-b.y||a.x-b.x);
}
// Mobile needs different typography rules: the thick letter strokes are only
// ~20-60px wide, so forcing an entire translation inside each pixel run
// favored only the shortest (often Arabic) phrases.
function mobileLayout(kind){
 const pixels=buildMask(kind);
 const inside=(x,y)=>{
  x=Math.round(x);y=Math.round(y);
  return x>=0&&y>=0&&x<W&&y<H&&pixels[(y*W+x)*4+3]>125;
 };
 // A deliberately balanced list: rotating the starting translation for each
 // position ensures the result isn't dominated by whichever phrase is shortest.
 const mini=[
  "I love you","Je t'aime","Te amo","Ti amo","Eu te amo",
  "愛してる","사랑해","我爱你","Mahal kita","Σ' αγαπώ",
  "Nakupenda","Volim te","Kocham cię","Te iubesc","أحبك",
  "Szeretlek","Miluji tě","Aku cinta kamu","Ik hou van jou",
  "Seni seviyorum","Jag älskar dig","Ich liebe dich"
 ];
 const choose=(target,row,col,maxWidth,base)=>{
  // First try the preferred language, shrinking its type as needed.
  // If it's genuinely too long, try the NEXT languages in the rotation.
  for(let pass=0;pass<mini.length;pass++){
   const word=mini[(target+pass)%mini.length];
   for(const f of [base,base*.91,base*.82,base*.74,base*.67]){
    m.font="700 "+f+"px Arial, sans-serif";
    const width=m.measureText(word).width;
    if(width<=maxWidth){
     return {text:word,font:f,width,
       color:palette[(row+col+target)%palette.length]};
    }
   }
  }
  return null;
 };
 const result=[];
 if(kind==="trin"){
  // Resolve the four character columns separately so a translated phrase can
  // be CENTERED on a narrow stroke instead of getting rejected by its width.
  let f=Math.min(H*.49,W*.265);
  m.font="900 "+f+"px Arial Black, Arial, sans-serif";
  while(m.measureText("TRIN").width>W*.87&&f>28){
   f-=3;m.font="900 "+f+"px Arial Black, Arial, sans-serif";
  }
  const widths=[..."TRIN"].map(letter=>m.measureText(letter).width);
  const full=m.measureText("TRIN").width;
  let cursor=W*.5-full*.5;
  const columns=widths.map(width=>{
   const column={left:cursor,right:cursor+width,center:cursor+width*.5};
   cursor+=width;return column;
  });
  const rows=12,step=f*.095;
  for(let row=0;row<rows;row++){
   const y=H*.448+(row-(rows-1)/2)*step;
   for(let col=0;col<4;col++){
    const column=columns[col];
    // Find the stroke nearest the middle of this character.
    const candidates=[];
    for(let x=Math.floor(column.left);x<column.right;x+=2)
     if(inside(x,y))candidates.push(x);
    if(!candidates.length)continue;
    let x=candidates[Math.floor(candidates.length/2)];
    // Allocate phrase width by center-to-center spacing, not letter-stroke
    // thickness. This permits words in the I and the T vertical stems.
    const leftBound=col===0?W*.035:(columns[col-1].center+column.center)/2;
    const rightBound=col===3?W*.965:(column.center+columns[col+1].center)/2;
    const maxWidth=Math.max(26,(rightBound-leftBound)-3);
    const desired=(row*4+col*5)%mini.length;
    const item=choose(desired,row,col,maxWidth,clamp(W/39,8.8,11.2));
    if(!item)continue;
    x=clamp(x,leftBound+item.width/2,rightBound-item.width/2);
    result.push({...item,x,y});
   }
  }
 }else{
  // Pack multiple readable phrases into each heart row, and keep both lobes
  // separate where the heart silhouette splits at the top.
  const base=clamp(W/36,9.5,12.5);
  const rowHeight=base*1.34;
  let number=0;
  for(let y=H*.13,row=0;y<H*.78;y+=rowHeight,row++){
   const runs=[];let a=-1;
   for(let x=Math.floor(W*.05);x<=Math.ceil(W*.95);x+=2){
    if(inside(x,y)){if(a<0)a=x}
    else if(a>=0){if(x-a>12)runs.push([a,x]);a=-1}
   }
   if(a>=0)runs.push([a,W*.95]);
   for(const [l,r] of runs){
    const left=l+3,right=r-3,length=right-left;
    if(length<16)continue;
    // Narrow tips should get one centered phrase instead of staying empty.
    if(length<45){
     const item=choose((number*3+row*2)%mini.length,row,number,length+20,base*.76);
     if(item)result.push({...item,x:(l+r)/2,y});
     number++;continue;
    }
    let pos=left;
    while(pos<right-20){
     const remaining=right-pos;
     const item=choose((number*7+row*3)%mini.length,row,number,remaining,base);
     if(!item)break;
     result.push({...item,x:pos+item.width*.5,y});
     pos+=item.width+Math.max(5,base*.48);
     number++;
    }
   }
  }
 }
 return result;
}
function rebuildWords(){
 const first=W<=620?mobileLayout("trin"):makeLayout("trin");
 const second=W<=620?mobileLayout("heart"):makeLayout("heart");
 const count=Math.max(first.length,second.length);
 if(!count){nodes=[];return}
 // Interpolate matching typography units, revealing extras instead of overlapping them.
 nodes=Array.from({length:count},(_,i)=>{
  const fi=Math.floor(i*first.length/count),ti=Math.floor(i*second.length/count);
  const f=first[fi],t=second[ti];
  return {from:f,to:t,showFrom:i*first.length/count-fi<first.length/count,
          showTo:i*second.length/count-ti<second.length/count,
          delay:((i*37)%101)/101*.66,offx:Math.sin(i*21.17)*W*.42,
          offy:Math.cos(i*12.87)*H*.38};
 });
 // Prevent visually duplicated phrases when one layout has fewer cells.
 const assign=(arr,key)=>{
  const used=new Set();
  for(const n of nodes){
   const point=n[key];if(used.has(point)){n[key==="from"?"showFrom":"showTo"]=false}
   else used.add(point);
  }
 };
 assign(first,"from");assign(second,"to");
}
function drawFlippedPhrase(text,x,y,font,color,opacity,flip){
 if(opacity<=.01)return;
 ctx.save();ctx.translate(x,y);
 // A 3D-style card flip: shrink the horizontal projection from edge-on to full width.
 // Small vertical overshoot makes each word feel like it is turning into place.
 const eased=smooth(flip);
 const angle=(1-eased)*Math.PI/2;
 const width=Math.max(.008,Math.cos(angle));
 ctx.scale(width,1+.075*Math.sin(angle));
 ctx.globalAlpha=opacity*eased;
 ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.font="700 "+font.toFixed(1)+"px Arial, sans-serif";
 ctx.fillStyle=color;ctx.shadowColor="#ff7b87";ctx.shadowBlur=4;
 ctx.fillText(text,0,0);
 ctx.restore();
}
function drawTypography(now){
 const elapsed=now-sceneAt;
 const morph=scene===2?(reduce?1:smooth((elapsed-240)/3400)):0;
 for(const n of nodes){
  const a=n.from,b=n.to;
  if(!a||!b)continue;
  if(scene===1){
   if(!n.showFrom)continue;
   // Each phrase independently flips in exactly where it belongs.
   const flip=reduce?1:smooth((elapsed-160-n.delay*3050)/920);
   drawFlippedPhrase(a.text,a.x,a.y,a.font,a.color,.98,flip);
  }else{
   // The existing TRIN letters flow to heart positions.
   const x=lerp(a.x,b.x,morph);
   const y=lerp(a.y,b.y,morph);
   const font=lerp(a.font,b.font,morph);
   const pulse=1+Math.sin(now/365)*.012*morph;
   const px=W*.5+(x-W*.5)*pulse;
   const py=H*.44+(y-H*.44)*pulse;
   // Half-turn swaps the language phrase without a visible hard cut.
   const turn=reduce?1:smooth((elapsed-400-n.delay*1250)/1900);
   const edge=Math.abs(Math.cos(turn*Math.PI));
   const text=turn<.5?a.text:b.text;
   const color=turn<.5?a.color:b.color;
   // Honor only unique word positions to avoid stacking phrases.
   const visibility=turn<.5?n.showFrom:n.showTo;
   if(!visibility)continue;
   ctx.save();ctx.translate(px,py);
   ctx.scale(Math.max(.006,edge),1+.09*Math.sin(turn*Math.PI));
   ctx.globalAlpha=.97;
   ctx.textAlign="center";ctx.textBaseline="middle";
   ctx.font="700 "+font.toFixed(1)+"px Arial, sans-serif";
   ctx.fillStyle=color;ctx.shadowColor="#ff7b87";ctx.shadowBlur=4;
   ctx.fillText(text,0,0);
   ctx.restore();
  }
 }
}
function renderCow(){
 if(!cowImage||!cowImage.naturalWidth)return;
 const density=1.25;
 const cw=Math.ceil(W*density),ch=Math.ceil(H*density);
 const sample=document.createElement("canvas");sample.width=cw;sample.height=ch;
 const s=sample.getContext("2d",{willReadFrequently:true});
 const f=Math.max(cw/cowImage.naturalWidth,ch/cowImage.naturalHeight);
 const sw=cowImage.naturalWidth*f,sh=cowImage.naturalHeight*f;
 // The original photo is drawn ONLY onto a temporary, invisible sample canvas.
 s.drawImage(cowImage,(cw-sw)/2,(ch-sh)/2,sw,sh);
 if(H>W*1.14){
  // Portrait phones get the entire cow photograph in a central text-portrait
  // panel while background pixels still supply colors for every text character.
  const containScale=Math.min(cw/cowImage.naturalWidth,ch*.78/cowImage.naturalHeight);
  const iw=cowImage.naturalWidth*containScale;
  const ih=cowImage.naturalHeight*containScale;
  s.fillStyle="#181019aa";
  s.fillRect(0,(ch-ih)/2-13,cw,ih+26);
  s.drawImage(cowImage,(cw-iw)/2,(ch-ih)/2,iw,ih);
 }
 const pixels=s.getImageData(0,0,cw,ch).data;
 const output=document.createElement("canvas");output.width=cw;output.height=ch;
 const c=output.getContext("2d");
 c.clearRect(0,0,cw,ch);c.textAlign="left";c.textBaseline="top";
 const font=clamp(Math.round(cw/160),9,13);
 const cell=font*.60,leading=font*.74;
 c.font="900 "+font+"px 'Courier New', monospace";
 const phrase="i love you i love you i love you ";
 let row=0;
 for(let y=0;y<ch;y+=leading,row++){
  const offset=row%2?cell*.5:0;
  for(let col=0,x=-offset;x<cw;x+=cell,col++){
   const ix=clamp(Math.floor(x+cell*.5),0,cw-1);
   const iy=clamp(Math.floor(y+font*.45),0,ch-1);
   const k=(iy*cw+ix)*4;
   let r=pixels[k],g=pixels[k+1],b=pixels[k+2];
   // Make shaded grass and fur visible on the dark backdrop while preserving color.
   const lum=(r*0.2126+g*0.7152+b*.0722);
   const lift=lum<65?(65-lum)*.67:0;
   r=clamp(Math.round(r*.98+14+lift),0,255);
   g=clamp(Math.round(g*.98+10+lift),0,255);
   b=clamp(Math.round(b*.98+8+lift),0,255);
   c.fillStyle="rgb("+r+","+g+","+b+")";
   // Every visible mark is a real character of the repeated phrase.
   c.fillText(phrase[(col+row*11)%phrase.length],x,y);
  }
 }
 cowCanvas=output;cowReady=true;
 if(scene===3)$("error").style.display="none";
}
function drawCow(now){
 if(!cowCanvas)return;
 const fade=reduce?1:smooth((now-sceneAt)/1600);
 ctx.save();ctx.globalAlpha=fade;
 ctx.translate(W/2,H/2);ctx.scale(cowZoom,cowZoom);
 ctx.drawImage(cowCanvas,-W/2,-H/2,W,H);
 ctx.restore();
}
function drawFinal(now){
 ctx.save();
 for(let i=0;i<45;i++){
  let x=(i*149.5+Math.sin(now*.00023+i)*38)%W;
  let y=((i*131.3-now*.013*(1+i%3))%H+H)%H;
  ctx.globalAlpha=.13+.23*(.5+.5*Math.sin(now*.001+i));
  ctx.fillStyle=i%3?"#ffd5e8":"#fff6e8";
  ctx.font=(9+i%8)+"px serif";
  ctx.fillText(i%3?"♡":"✦",x,y);
 }
 ctx.restore();
}
function draw(now){
 ctx.clearRect(0,0,W,H);
 if(scene===1||scene===2)drawTypography(now);
 if(scene===3)drawCow(now);
 if(scene===4)drawFinal(now);
 requestAnimationFrame(draw);
}
function size(){
 W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);DPR=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 rebuildWords();
 if(cowImage&&cowImage.complete&&cowImage.naturalWidth)renderCow();
}
function goto(next,auto=true){
 clearTimeout(nextTimer);
 scene=clamp(next,0,4);sceneAt=performance.now();
 if(scene===4)completed=true;
 $("intro").classList.toggle("active",scene===0);
 $("final").classList.toggle("active",scene===4);
 $("nav").classList.toggle("active",scene!==0);
 $("zoom").classList.toggle("active",scene===3);
 $("chapter").textContent=["","01 / TRIN","02 / HEART","03 / COW","04 / 11 MONTHS"][scene];
 dots.forEach((d,i)=>d.classList.toggle("on",i===scene-1));
 $("back").disabled=scene===0;
 $("next").textContent=scene===4?"↻ Replay":"Next →";
 // Until the full automatic show finishes, do not offer a skip button.
 $("next").style.visibility=completed?"visible":"hidden";
 $("next").disabled=!completed;
 $("error").style.display=scene===3&&!cowReady?"block":"none";
 if(scene===3&&!cowReady)$("error").textContent="Preparing the little cow surprise…";
 ["trinCaption","heartCaption","cowCaption"].forEach(id=>$(id).classList.remove("visible"));
 // Reduced-motion preferences skip the flips, never the storyline.
 // A first watch advances automatically; returning to scenes after completion is manual.
 if(auto&&!completed&&timings[scene]){
  nextTimer=setTimeout(()=>goto(scene+1,true),timings[scene]);
 }
}
function beginShow(){
 clearTimeout(nextTimer);
 completed=false;
 cowZoom=1;
 goto(1,true);
}
function zoom(by){cowZoom=clamp(+(cowZoom+by).toFixed(2),.75,4)}
$("start").addEventListener("click",beginShow);
$("replay").addEventListener("click",beginShow);
$("back").addEventListener("click",()=>goto(scene-1,false));
$("next").addEventListener("click",()=>{if(!completed)return;if(scene===4)beginShow();else goto(scene+1,false)});
$("zoomin").addEventListener("click",()=>zoom(.35));
$("zoomout").addEventListener("click",()=>zoom(-.35));
canvas.addEventListener("wheel",e=>{if(scene!==3)return;e.preventDefault();zoom(e.deltaY<0?.18:-.18)},{passive:false});
addEventListener("keydown",e=>{if(scene===0)return;if(e.key==="ArrowLeft")goto(scene-1,false);if(e.key==="ArrowRight"&&completed){if(scene===4)beginShow();else goto(scene+1,false)}});
addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(size,200)});
size();requestAnimationFrame(draw);
cowImage=new Image();cowImage.onload=renderCow;
cowImage.onerror=()=>{cowReady=false;if(scene===3){$("error").textContent="Couldn't load cow.jpg from the repository."; $("error").style.display="block"}};
cowImage.src="./cow.jpg";
})();
</script>
</body></html>
